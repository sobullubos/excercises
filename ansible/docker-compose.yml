version: '3.8'

services:

  ansible-control:
    build: ./ansible-control
    container_name: ansible-control
    networks:
      - ansible-net
    tty: true
    depends_on:
      - machine-1
      - machine-2

  machine-1:
    build: ./ssh-machine
    container_name: machine-1
    networks:
      - ansible-net

  machine-2:
    build: ./ssh-machine
    container_name: machine-2
    networks:
      - ansible-net

networks:
  ansible-net:
    driver: bridge